<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <title>ViewTube</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" type="module"></script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <header class="top">
    <div class="brand-group">
      <button id="menu" class="icon-button" aria-label="Меню" aria-expanded="true" aria-controls="nav"></button>
      <a class="brand" href="#/" aria-label="ViewTube — главная"><span class="brand-mark"></span>ViewTube</a>
    </div>
    <form class="search" role="search" id="search">
      <input id="query" type="search" name="q" placeholder="Введите запрос" aria-label="Поиск по названию" maxlength="140">
      <button type="submit" aria-label="Найти" id="search-button"></button>
    </form>
    <div class="top-actions" id="account"></div>
  </header>
  <button type="button" id="nav-scrim" aria-label="Закрыть меню" tabindex="-1" hidden></button>
  <nav class="sidebar" id="nav" aria-label="Основное меню"></nav>
  <main id="main" tabindex="-1" aria-busy="true"><p class="notice">Загружаем видео…</p></main>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
